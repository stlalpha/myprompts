name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint (default severity)
        run: |
          # install.sh and lib/*.sh must be linted together: install.sh
          # sources the lib/ modules via a runtime-computed path, so
          # shellcheck can only resolve the cross-file globals (VW_*,
          # pending_*, INTERACTIVE, etc.) when both sides are passed in the
          # same invocation.
          shellcheck install.sh uninstall.sh run_tests.sh vaporwave_ls_setup.sh \
                     config/*.sh themes/*.sh lib/*.sh test_*.sh
          # Prompts are sourced, not executed; tell shellcheck which shell.
          shellcheck --shell=bash vaporwave_bash_prompt
          # vaporwave_zsh_prompt is intentionally NOT linted: shellcheck has
          # no zsh support and would misparse zsh-only syntax.

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Record bash version
        run: /bin/bash --version | head -1
      - name: Run suite
        run: ./run_tests.sh
