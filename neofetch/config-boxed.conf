# Signal Mine Neofetch Config - Boxed Style
# Minimal boxed layout with cyan/teal color scheme
# Colors: Cyan (44), Dark Cyan (24)

print_info() {
    prin ""
    prin "$(color 44) .----------------------------------------.$(color 7)"
    prin "$(color 44) :                                        :$(color 7)"
    info "$(color 44) :  $(color 44)User     $(color 24)" title
    info "$(color 44) :  $(color 44)OS       $(color 24)" distro
    info "$(color 44) :  $(color 44)Host     $(color 24)" model
    info "$(color 44) :  $(color 44)Kernel   $(color 24)" kernel
    info "$(color 44) :  $(color 44)Uptime   $(color 24)" uptime
    info "$(color 44) :  $(color 44)Shell    $(color 24)" shell
    prin "$(color 44) :                                        :$(color 7)"
    info "$(color 44) :  $(color 44)CPU      $(color 24)" cpu
    info "$(color 44) :  $(color 44)GPU      $(color 24)" gpu
    info "$(color 44) :  $(color 44)Memory   $(color 24)" memory
    info "$(color 44) :  $(color 44)Disk     $(color 24)" disk
    info "$(color 44) :  $(color 44)Display  $(color 24)" resolution
    prin "$(color 44) :                                        :$(color 7)"
    info "$(color 44) :  $(color 44)Local    $(color 24)" local_ip
    info "$(color 44) :  $(color 44)Public   $(color 24)" public_ip
    prin "$(color 44) :                                        :$(color 7)"
    prin "$(color 44) \`----------------------------------------'$(color 7)"
    prin ""
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="tiny"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="tiny"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="on"

# IP Address
public_ip_host="http://ident.me"
public_ip_timeout=2

# Disk
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

# Text Colors - Minimal cyan palette
# Order: title, @, underline, subtitle, colon, info
colors=(44 24 44 24 44 24)

# Text Options
bold="on"
underline_enabled="off"
underline_char="─"

# Separator
separator=": "

# Color Blocks
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# Progress Bars
bar_char_elapsed="━"
bar_char_total="─"
bar_border="on"
bar_length=15
bar_color_elapsed=198
bar_color_total=93

# Display
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

# Backend
image_backend="ascii"
image_source="/Users/jm/.config/neofetch/signalmine.txt"

# ASCII Options
ascii_distro="auto"
# ASCII colors: cyan, dark cyan
ascii_colors=(44 24)
ascii_bold="on"

# Image Options
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=2
yoffset=0
xoffset=0
background_color=

# Misc
stdout="off"
