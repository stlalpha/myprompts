# Spaceman Vaporwave Neofetch Config
# Themed to match the spaceman.zsh-theme
# Colors: Neon Pink (198), Cyan (51), Purple (141), Orange (209), Mint Green (85), Magenta (201)

print_info() {
    prin ""
    prin "$(color 51)    ✧ $(color 209)$(hostname)$(color 51) ✧$(color 7)"
    prin ""
    
    info "$(color 198)◆$(color 7) User" title
    info "$(color 51)◆$(color 7) OS" distro
    info "$(color 141)◆$(color 7) Host" model
    info "$(color 209)◆$(color 7) Kernel" kernel
    info "$(color 85)◆$(color 7) Uptime" uptime
    info "$(color 201)◆$(color 7) Shell" shell
    
    prin ""
    prin "$(color 198)【$(color 51)H A R D W A R E$(color 198)】$(color 7)"
    prin ""
    
    info "$(color 51)◆$(color 7) CPU" cpu
    info "$(color 141)◆$(color 7) GPU" gpu
    info "$(color 209)◆$(color 7) Memory" memory
    info "$(color 85)◆$(color 7) Disk" disk
    info "$(color 201)◆$(color 7) Resolution" resolution
    
    prin ""
    prin "$(color 198)【$(color 85)N E T W O R K$(color 198)】$(color 7)"
    prin ""
    
    info "$(color 51)◆$(color 7) Local IP" local_ip
    info "$(color 141)◆$(color 7) Public IP" public_ip

    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
    prin ""
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="tiny"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="tiny"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="on"

# IP Address
public_ip_host="http://ident.me"
public_ip_timeout=2

# Disk
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

# Text Colors - Vaporwave palette matching zsh theme
# Order: title, @, underline, subtitle, colon, info
# 198=neon pink, 51=cyan, 141=purple, 209=orange, 85=mint, 201=magenta
colors=(198 93 51 209 141 85)

# Text Options
bold="on"
underline_enabled="off"
underline_char="─"

# Separator
separator=": "

# Color Blocks
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# Progress Bars
bar_char_elapsed="━"
bar_char_total="─"
bar_border="on"
bar_length=15
bar_color_elapsed=198
bar_color_total=93

# Display
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

# Backend
image_backend="ascii"
image_source="/Users/jm/.config/neofetch/signalmine.txt"

# ASCII Options
ascii_distro="auto"
# Vaporwave ASCII colors: pink, cyan, purple, orange, mint, magenta
ascii_colors=(44 24)
ascii_bold="on"

# Image Options
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
background_color=

# Misc
stdout="off"
